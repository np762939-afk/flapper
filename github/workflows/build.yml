name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www && cp index.html www/
          npx cap init Flapper com.flapper.game --web-dir www
          npx cap add android
          npx cap sync android
      - name: Fixed signing key and version
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "NO KEYSTORE FOUND"; fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Apply icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets && cp icon.png assets/icon.png
            npm i @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#131314' --iconBackgroundColorDark '#131314'
          fi
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Flapper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
