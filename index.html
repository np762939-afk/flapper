function bAI(c,t){const L=c.L,p=pol(t),n=num(t);c.pol+=p;let r;
if(p<0){c.pat--;r='Давайте без грубости.'}
else if(n){const fl=L.ask*(L.fl-.025*S.up.h-(c.pol>0?.01:0));if(n>=L.ask){r=`Хорошо, ${F(L.ask)}.`;c.offer=L.ask;c.st='deal'}else if(n>=fl){r=pk(['Ладно, уступлю.','Хорошо, по рукам.']);c.offer=n;c.st='deal'}else if(n<L.ask*.6){r='Это несерьёзно.';c.pat--}else{c.cn=r10((fl+(L.ask-fl)*.25));r=`Меньше ${F(c.cn)} не отдам.`;c.pat--}}
else if(/комплект|коробк|заряд|чехол|кабел/i.test(t))r=KIT.includes(L.c)?`В комплекте: ${kitTxt(L)}.`:'Комплекта нет, только сам товар.';
else if(/дефект|проблем|состоян|ломан|разбит|царап|работает/i.test(t)){const sh=L.d.filter(x=>!DF[x][2]||L.disc.includes(x));r=sh.length?'Из недостатков: '+sh.map(x=>DF[x][0].toLowerCase()).join(', ')+'.':'Состояние хорошее, всё работает.';if(L.d.some(x=>DF[x][2]&&!L.disc.includes(x))&&Math.random()<.2*S.up.a)r+=' Ну... посмотрите фото повнимательнее.'}
else if(/торг|скидк|уступ|дешев/i.test(t))r='Торг уместен, называйте цену.';else r=pk(['Да, ещё продаётся.','Слушаю вас.','Готов ответить на вопросы.']);
c.msgs.push({f:'ai',t:r});if(c.pat<=0&&c.st!='deal'){c.st='closed';c.msgs.push({f:'ai',t:'Мне некогда, до свидания.'})}}
function sAI(c,t){const p=pol(t),n=num(t),it=c.L.it;c.pol+=p;let r;
if(p<0){c.pat--;r=c.ty=='t'?'Сам такой! Отзыв тебе обеспечен.':'Попрошу без хамства.'}
else if(n){if(n<=c.max){c.offer=n;c.st='deal';r=`Ок, беру за ${F(n)}.`}else if(c.max>c.offer*1.02&&c.pat>0){c.offer=r10(c.offer+(c.max-c.offer)*.5);r=`Могу до ${F(c.offer)}.`;c.pat--}else{c.st='closed';c.offer=0;r=c.ty=='n'?'Не потяну, спасибо.':'Ценник завышен, ищи дурака. Напишу отзыв!';if(c.ty!='n')addRev(1,'Жадный продавец, цена космос.',c.who,'покупатель')}}
else if(/комплект|коробк|заряд|чехол|кабел/i.test(t)){if(!c.ka){c.ka=1;c.pol++}r=it.kit&&it.kit.length?'Отлично, комплект — это плюс.':'Ясно, без комплекта.'}
else if(/дефект|состоян|работает|царап/i.test(t))r=it.d.length&&c.L.disc?'Вижу в описании: '+it.d.map(x=>DF[x][0].toLowerCase()).join(', ')+'.':'Хорошо, посмотрю на фото.';

c.msgs.push({f:'ai',t:r});if(c.pat<=0&&c.st!='deal'&&c.st!='closed'){c.st='closed';c.msgs.push({f:'ai',t:'Ладно, ищу другой вариант.'})}}
function sold(cid){const c=S.chats.find(x=>x.id==cid),L=c.L,it=L.it,pr=c.offer,m=mkk(it);S.bal+=pr;const pf=pr-it.cost;S.earn+=pf;S.dc.earn=(S.dc.earn||0)+pf;S.cnt.sold++;S.dc.sold++;

function fix(id,x,cp){const it=gi(id);if(x=='pass'){if(!S.inv.some(o=>o.id!=id&&o.root))return toast('Нет другого устройства с root');it.d=it.d.filter(y=>y!='pass');S.cnt.rep++;S.dc.rep++;toast('Пароль сброшен');return repM(id)}
const c=cp?r10(rc(it,x)*.65):rc(it,x);if(S.bal<c)return toast('Не хватает денег');S.bal-=c;it.cost+=c;if(cp&&Math.random()>rs())toast('Копия не прижилась, деньги потеряны');else{it.d=it.d.filter(y=>y!=x);if(x=='bat')it.bh=rr(92,100);S.cnt.rep++;S.dc.rep++;toast('Починено')}hdr();repM(id)}

const CR='<path d="M30 0L50 42L34 68M50 42L88 28M50 42L68 100" stroke="#fff" stroke-width="1.4" fill="none"/>',sv=c=>`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${c}</svg>`;

function v3(k,id){const it=k=='L'?S.feed.find(x=>x.id==id):gi(id);if(!it||!CATP[it.n])return;const P=CATP[it.n],W=150,H=Math.round(W/P.a),Dp=14,r=Math.round(W*.09),ex=it.d.filter(x=>DF[x][2]),fc=(st,h)=>`<div class=fc style="${st}">${h}</div>`,bs=`width:${W}px;height:${H}px;border-radius:${r}px;overflow:hidden;`,sd=`background:${P.e};`,bk=P.nb?`<div style="width:100%;height:100%;background:linear-gradient(160deg,${P.e},#000b);position:relative"><div style="position:absolute;left:10%;top:6%;width:42%;height:17%;border-radius:20%;background:#0007;border:2px solid #fff3"></div></div>`:`<img src="${P.b}">`,

sl=sd2(`rotateY(-90deg) translateZ(${W/2}px)`,Dp,H-2*r,`left:50%;top:${r}px;margin-left:-${Dp/2}px;`),sr=sd2(`rotateY(90deg) translateZ(${W/2}px)`,Dp,H-2*r,`left:50%;top:${r}px;margin-left:-${Dp/2}px;`),

const sc=$('#sc');sc.onpointerdown=e=>{R3.drag=1;R3.lx=e.clientX;R3.ly=e.clientY;R3.tg=null;sc.setPointerCapture&&sc.setPointerCapture(e.pointerId)};sc.onpointermove=e=>{if(!R3.drag)return;R3.ry+=(e.clientX-R3.lx)*.6;R3.rx=Math.max(-70,Math.min(70,R3.rx-(e.clientY-R3.ly)*.4));R3.lx=e.clientX;R3.ly=e.clientY};sc.onpointerup=sc.onpointercancel=()=>{R3.drag=0};
