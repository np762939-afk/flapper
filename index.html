<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131314"><title>Flapper</title><style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

</style></head><body><div id="app"><div id="top"></div><div id="main"></div><div id="nav"></div></div><div id="ov"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),rr=(a,b)=>Math.round(R(a,b)),pk=a=>a[Math.random()*a.length|0],F=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',r10=n=>Math.round(n/10)*10;

l:`Apple MacBook;Air M1:55000,Air M2:75000,Pro 14 M3:130000|Lenovo;IdeaPad 3:30000,ThinkPad T480:20000,ThinkPad X1 Carbon:45000|ASUS;VivoBook 15:32000,TUF Gaming F15:65000,ROG Strix G16:120000|Acer;Aspire 5:30000,Nitro 5:60000|HP;250 G8:25000,Pavilion 15:40000|Dell;Inspiron 15:35000,XPS 13:60000|Huawei;MateBook D15:38000`,

const SL={cpu:'Процессор',gpu:'Видеокарта',ram:'ОЗУ',ssd:'Накопитель',mb:'Мат. плата',psu:'Блок питания',case:'Корпус ПК',ph_ram:'Телефон: ОЗУ',ph_mem:'Телефон: память',ph_scr:'Телефон: экран',ph_back:'Телефон: крышка',ph_cam:'Телефон: камера',ph_body:'Телефон: корпус',ph_mb:'Телефон: плата',ph_bat:'Телефон: аккумулятор',ph_port:'Телефон: порт'};

const D=[];for(const c in DATA)DATA[c].split('|').forEach(g=>{const[b,l]=g.split(';');l.split(',').forEach(e=>{const i=e.lastIndexOf(':'),m=e.slice(0,i),p=+e.slice(i+1);D.push(c=='u'?{c,s:b,n:SL[b]+' '+m,b:p}:{c,n:b=='Прочие'?m:b+' '+m,b:p})})});
const CO=[['Чёрный','#26262a'],['Белый','#ecece8'],['Синий','#3b6fd6'],['Зелёный','#3a9a6a'],['Фиолетовый','#8b6fd0'],['Золотой','#d4b36a'],['Красный','#c93c3c'],['Серебристый','#bfc4cc']];
const DF={scr:['Разбит экран',.3,1],back:['Разбита задняя крышка',.1,1],cam:['Сломана камера',.2,1],bat:['Сломан аккумулятор',.15,0],port:['Сломан порт зарядки',.12,0],pass:['Забыт пароль',.2,0]};
const EM={l:'💻',k:'🎮',a:'🎧',c:'🖥️',u:'🧩'},NM=['Алексей','Мария','Дмитрий','Ольга','Игорь','Анна','Сергей','TechGuy77','Максим','Влад','Ирина','Katya_shop'];
const W=['p','p','p','p','p','p','p','l','l','t','k','a','c','u','u','u','u'];
let mk=D.map(()=>1),view='feed',C=null,S=JSON.parse(localStorage.getItem('fl1')||'null')||{bal:20000,earn:0,nick:'Flapper_'+rr(100,999),uid:0,inv:[],my:[],feed:[],chats:[],rev:[],up:{h:0,a:0,r:0,p:0},cnt:{sold:0,bought:0,rep:0,built:0,five:0,revs:0},dc:{},dd:'',lastd:'',streak:0,cl:{}};
const hb=i=>i.c=='p'||i.c=='t',gi=id=>S.inv.find(x=>x.id==id),mkt=i=>i.b*(i.k>=0?mk[i.k]:1);
const dsum=(i,f)=>i.d.reduce((s,x)=>s+(!f||f(x)?DF[x][1]:0),0),val=i=>mkt(i)*(1+i.deco)*(1-dsum(i));
const pol=t=>/дурак|идиот|мошенн|хрен|сука|бляд|говн|развод|жмот|жадин|(^|\s)лох/i.test(t)?-1:/здравств|добр|привет|пожалуйста|спасибо|благодар/i.test(t)?1:0;
const num=t=>{const m=t.replace(/(\d)[\s.](?=\d{3})/g,'$1').match(/(\d+(?:,\d+)?)\s*(к|k|тыс)?/i);if(!m)return 0;const n=parseFloat(m[1].replace(',','.'))*(m[2]?1000:1);return n>=300?Math.round(n):0};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2200)}
const today=()=>new Date().toDateString();
function chkDay(){if(S.dd!=today()){S.dd=today();S.dc={sold:0,bought:0,rep:0,msg:0,earn:0};Object.keys(S.cl).filter(k=>k[0]=='d').forEach(k=>delete S.cl[k])}}
function rollD(c){const p=c=='p'?{scr:.14,back:.12,cam:.08,bat:.1,port:.08,pass:.07}:c=='l'||c=='t'?{scr:.1,bat:.1,port:.05}:{};return Object.keys(p).filter(x=>Math.random()<p[x])}
function mkL(){const c=pk(W),ks=D.map((d,i)=>d.c==c?i:-1).filter(i=>i>=0),k=pk(ks),d=D[k],df=rollD(c),disc=df.filter(x=>DF[x][2]&&Math.random()<.45),pers=pk(['n','n','n','g','f']),open=df.filter(x=>!DF[x][2]||disc.includes(x));
return{id:++S.uid,k,n:d.n,c,col:c=='p'?rr(0,7):0,d:df,disc,pers,sel:pk(NM),rt:+R(3.6,5).toFixed(1),hr:Math.random(),fl:pers=='g'?.96:pers=='f'?.8:R(.84,.92),ask:r10(Math.max(c=='u'?300:2000,d.b*mk[k]*(1-open.reduce((s,x)=>s+DF[x][1],0))*R(.88,1.12)*(pers=='g'?1.12:pers=='f'?.93:1)))}}
function art(it,v=0,w=60){if(!hb(it))return`<div class=ic style="width:${w}px;height:${w*1.2}px;font-size:${w*.5}px">${EM[it.c]}${it.d&&it.d.includes('scr')?'💥':''}</div>`;
const T=it.c=='t',Wd=T?140:84,H=T?100:160,d=it.d,c=CO[it.col||0][1];let s=`<svg viewBox="-3 -3 ${Wd+6} ${H+6}" width="${w*(T?1.6:.8)}"><rect width="${Wd}" height="${H}" rx="12" fill="${v?c:'#0c0c0e'}" stroke="#666" stroke-width="2"/>`;
if(!v)s+=`<rect x="5" y="9" width="${Wd-10}" height="${H-18}" rx="6" fill="#1e2a3a"/>`+(d.includes('scr')?`<path d="M${Wd*.3} 9L${Wd*.5} ${H*.45}L${Wd*.35} ${H*.7}M${Wd*.5} ${H*.45}L${Wd*.85} ${H*.3}M${Wd*.5} ${H*.45}L${Wd*.7} ${H-9}" stroke="#fff" stroke-width="1.3" fill="none"/>`:'');
else s+=`<circle cx="20" cy="20" r="9" fill="#111" stroke="#888"/><circle cx="20" cy="42" r="6" fill="#111" stroke="#888"/>`+(d.includes('cam')?`<path d="M13 13L27 27M27 13L13 27" stroke="#e55" stroke-width="2"/>`:'')+(d.includes('back')?`<path d="M${Wd-8} 10L${Wd*.55} ${H*.5}L${Wd*.72} ${H*.62}L${Wd*.3} ${H-8}" stroke="#fff" stroke-width="1.4" fill="none" opacity=".85"/>`:'');
return s+'</svg>'}
const ov=h=>{$('#ov').innerHTML=h;$('#ov').style.display='flex'},cl=()=>{$('#ov').style.display='none';C=null;render()};
const head=t=>`<div class=row><button class="b s" onclick=cl()>←</button><b class=col>${t}</b></div>`;
const unread=()=>S.chats.reduce((s,c)=>s+(c.un||0),0),tags=d=>d.map(x=>`<span class=tag>${DF[x][0]}</span>`).join('');
const V={
feed:()=>`<h3>Лента объявлений</h3><div class=m>Новые лоты появляются сами. Рынок меняется в реальном времени.</div>`+S.feed.map(L=>{const m=mkt(L),hid=L.d.some(x=>DF[x][2]&&!L.disc.includes(x));return`<div class="card row" onclick="openL(${L.id})">${art(L,0,56)}<div class=col><b>${L.n}</b><div class=m>${L.c=='p'?CO[L.col][0]+' · ':''}${L.sel} ★${L.rt}</div><div><b>${F(L.ask)}</b> <span class="m ${L.ask<m*.85?'g':''}">рынок ~${F(m)}</span>${hid&&L.hr<.2*S.up.a?' 🔍':''}</div></div></div>`}).join(''),
chats:()=>`<h3>Чаты</h3>`+(S.chats.map(c=>`<div class="card row" onclick="chatOpen(${c.id})"><div class=col><b>${c.who}</b> <span class=m>${c.kind=='b'?'продавец':'покупатель'}${c.st=='closed'?' · закрыт':''}</span><div class=m>${c.L.n}: ${c.msgs[c.msgs.length-1].t.slice(0,50)}</div></div>${c.un?`<b class=rd>${c.un}</b>`:''}</div>`).join('')||'<div class=m>Чатов пока нет. Напиши продавцу или выставь товар.</div>'),
inv:()=>{const dv=S.inv.filter(x=>x.c!='u'),pt=S.inv.filter(x=>x.c=='u');return`<h3>Склад</h3>`+(dv.map(it=>`<div class=card><div class=row>${art(it,0,50)}<div class=col><b>${it.n}</b>${it.keep?' ⭐':''}<div class=m>${it.c=='p'?CO[it.col][0]+' · ':''}стоит ~${F(val(it))} · вложено ${F(it.cost)}</div>${tags(it.d)||'<span class="tag g">исправно</span>'}</div></div><div class="row wrap" style="margin-top:8px"><button class="b" onclick="sellM(${it.id})">Продать</button>${it.d.length?`<button class="b s" onclick="repM(${it.id})">Ремонт</button>`:''}${hb(it)?`<button class="b s" onclick="decM(${it.id})">Украсить</button>`:''}${it.c=='p'&&!it.root?`<button class="b s" onclick="root(${it.id})">Root 500₽</button>`:''}<button class="b s" onclick="keep(${it.id})">${it.keep?'Не оставлять':'Оставить себе'}</button></div></div>`).join('')||'<div class=m>Пусто. Купи что-нибудь в ленте.</div>')+(pt.length?`<h3>Запчасти</h3>`+pt.map(x=>`<div class="card row"><div class=col>${x.n}</div><span class=m>${F(val(x))}</span><button class="b s" onclick="sellM(${x.id})">Продать</button></div>`).join(''):'')},
build:()=>{const bl=(t,sl,nm)=>`<div class=card><b>${nm}</b>`+sl.map(s=>`<div class=row style="margin:6px 0"><div class=m style="width:105px">${SL[s]}</div><select id="b_${s}"><option value=0>— выбрать —</option>${S.inv.filter(x=>x.s==s).map(x=>`<option value=${x.id}>${x.n} (${F(x.b)})</option>`).join('')}</select></div>`).join('')+`<button class=b onclick="build('${t}')">Собрать</button></div>`;return`<h3>Сборка</h3><div class=m>Детали покупай в ленте. Собранное устройство стоит на 25% больше суммы деталей.</div>`+bl('p',PH,'Телефон')+bl('c',PC,'ПК / ноутбук')},
up:()=>`<h3>Улучшения</h3>`+[['h','🤝 Торг','Продавцы уступают больше, покупатели платят чуть больше'],['a','🔍 Внимательность','Подсказки о скрытых поломках в ленте и в чате'],['r','🔧 Ремонт','Запчасти дешевле на 5%, копии ставятся надёжнее'],['p','📸 Фотостудия','Больше покупателей и +2% к цене продажи за уровень']].map(u=>{const l=S.up[u[0]],c=[4000,9000,18000,35000,70000][l];return`<div class=card><b>${u[1]}</b> <span class=m>ур. ${l}/5</span><div class=m>${u[2]}</div>${l<5?`<button class=b style="margin-top:6px" onclick="upg('${u[0]}')">Улучшить за ${F(c)}</button>`:'<div class=g>Максимум</div>'}</div>`}).join(''),
q:()=>{const ok=S.lastd!=today(),qs=(t,A)=>A.map((q,i)=>{const p=t=='d'?S.dc[q[0]]||0:go(q[0]),d=S.cl[t+i];return`<div class=card><div class=row><div class=col>${q[1]}<div class=bar><i style="width:${Math.min(100,p/q[2]*100)}%"></i></div><span class=m>${F(Math.min(p,q[2])).replace(' ₽','')} / ${F(q[2]).replace(' ₽','')}</span></div><button class=b ${d||p<q[2]?'disabled':''} onclick="claim('${t}',${i})">${d?'Получено':'+'+F(q[3])}</button></div></div>`}).join('');return`<h3>Ежедневная награда</h3><div class="card row"><div class=col>Серия: ${S.streak} дн.</div><button class=b ${ok?'':'disabled'} onclick=daily()>${ok?'Забрать '+F(500*Math.min(S.streak+1,7)):'Завтра'}</button></div><h3>Задания дня</h3>`+qs('d',QD)+`<h3>Достижения</h3>`+qs('o',QO)},
prof:()=>{const av=S.rev.length?(S.rev.reduce((s,r)=>s+r.s,0)/S.rev.length).toFixed(1):'—';return`<h3>Профиль</h3><div class=card><div class=row><input id=nk value="${S.nick}" maxlength=20><button class=b onclick="S.nick=$('#nk').value||S.nick;toast('Сохранено')">OK</button></div><div style="margin-top:8px">Баланс: <b>${F(S.bal)}</b><br>Заработок: <b class="${S.earn<0?'rd':'g'}">${F(S.earn)}</b><br>Рейтинг: <b>★${av}</b> (${S.cnt.revs} отзывов) · продано ${S.cnt.sold}</div></div><h3>Мои объявления</h3>`+(S.my.map(L=>`<div class="card row">${art(L.it,0,40)}<div class=col>${L.it.n}<div class=m>${F(L.ask)}</div></div><button class="b s" onclick="unlist(${L.id})">Снять</button></div>`).join('')||'<div class=m>Нет активных</div>')+`<h3>Отзывы обо мне</h3>`+(S.rev.map(r=>`<div class=card><b>${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)}</b> <span class=m>${r.w} (${r.side})</span><div>${r.t}</div></div>`).join('')||'<div class=m>Пока нет отзывов</div>')}};
const QD=[['sold','Продай 2 устройства',2,1500],['earn','Выйди в заработок за день на 5 000 ₽',5000,2500],['bought','Купи 3 лота',3,800],['rep','Почини 1 устройство',1,1000],['msg','Отправь 10 сообщений',10,600]];

function upg(k){const c=[4000,9000,18000,35000,70000][S.up[k]];if(S.bal<c)return toast('Не хватает денег');S.bal-=c;S.up[k]++;render()}
function openL(id){const L=S.feed.find(x=>x.id==id);if(!L)return;const hid=L.d.some(x=>DF[x][2]&&!L.disc.includes(x)),sh=L.d.filter(x=>!DF[x][2]||L.disc.includes(x));
ov(head(L.n)+`<div class=row style="justify-content:center;margin:8px">${art(L,0,110)}${hb(L)?art(L,1,110):''}</div><div class=m style="text-align:center">${hb(L)?'Фото: экран и задняя панель':'Фото товара'}</div><div class=card><b style="font-size:20px">${F(L.ask)}</b> <span class=m>рынок ~${F(mkt(L))}</span><br>${L.c=='p'?'Цвет: '+CO[L.col][0]+'<br>':''}Продавец: ${L.sel} ★${L.rt}<br>Состояние: ${sh.length?tags(sh):'отличное, всё работает'}${hid&&L.hr<.2*S.up.a?'<div class=g style="margin-top:6px">🔍 Внимательность: на фото что-то не так, присмотрись</div>':''}</div><button class=b onclick="buy(${L.id},${L.ask})">Купить за ${F(L.ask)}</button><button class="b s" onclick="chatNew(${L.id})">Написать продавцу и поторговаться</button>`)}
function buy(id,pr,cid){const L=S.feed.find(x=>x.id==id);if(!L)return toast('Лот уже продан');if(S.bal<pr)return toast('Не хватает денег');const c=S.chats.find(x=>x.id==cid)||S.chats.find(x=>x.kind=='b'&&x.L.id==id),m=mkt(L),ra=pr/m;S.bal-=pr;S.inv.push({id:++S.uid,k:L.k,n:L.n,c:L.c,b:D[L.k].b,s:D[L.k].s,col:L.col,d:[...L.d],cost:pr,deco:0,root:0,keep:0});S.feed=S.feed.filter(x=>x.id!=id);S.chats.forEach(x=>x.kind=='b'&&x.L.id==id&&(x.st='closed'));
let s=ra>=.9?5:ra>=.78?4:ra>=.65?3:2;if(c&&c.pol<0)s--;s=Math.max(1,s);addRev(s,pk(RT[s]),L.sel,'продавец');S.cnt.bought++;S.dc.bought++;
ov(head('Покупка')+`<div class=card>Куплено: <b>${L.n}</b> за ${F(pr)}.<br>${L.sel} оставил отзыв: ${'★'.repeat(s)}<div class=m>${pk(RT[s])}</div></div><div class=m>Оцени продавца:</div><div class=row>${[1,2,3,4,5].map(n=>`<button class="b s" onclick="toast('Оценка ${n}★ отправлена');cl()">${n}★</button>`).join('')}</div>`)}
const RT={5:['Вежливый покупатель, цена честная!','Быстро договорились, спасибо.'],4:['Нормальная сделка, немного поторговались.'],3:['Сильно сбил цену, но ладно.'],2:['Демпинг и неприятный торг.'],1:['Хамство и бессовестный торг.']};
function addRev(s,t,w,side){S.rev.unshift({s,t,w,side});S.rev.length>40&&S.rev.pop();S.cnt.revs++;if(s==5)S.cnt.five++}
function chatNew(id){const L=S.feed.find(x=>x.id==id);if(!L)return;let c=S.chats.find(x=>x.kind=='b'&&x.L.id==id);if(!c){c={id:++S.uid,kind:'b',L,who:L.sel,msgs:[{f:'ai',t:'Здравствуйте! Объявление актуально.'}],st:'open',pat:3,pol:0,un:0};S.chats.unshift(c)}chatOpen(c.id)}
function chatOpen(id){C=S.chats.find(c=>c.id==id);C.un=0;drawChat()}
function drawChat(){const c=C,L=c.L,b=c.kind=='b',o=c.st=='deal'?c.offer:b?c.cn:c.offer,q=t=>`<button class="b s" onclick="qs('${t}')">${t.slice(0,22)}</button>`;
ov(head(`${c.who} <span class=m>${L.n} · ${F(L.ask)}</span>`)+`<div id=ms style="flex:1;overflow:auto">${c.msgs.map(m=>`<div class="msg ${m.f}">${m.t}</div>`).join('')}</div>`+(c.st=='closed'?'<div class=m>Диалог завершён</div>':`${o?`<button class=b onclick="${b?`buy(${L.id},${o},${c.id})`:`sold(${c.id})`}">${b?'Купить':'Продать'} за ${F(o)}</button>`:''}<div class="row wrap">${q('Здравствуйте! Торг возможен?')}${q(b?'Какие есть дефекты?':'Состояние отличное')}${q('Предлагаю '+r10(L.ask*.85))}</div><div class=row><input id=inp placeholder="Сообщение или цена" onkeydown="event.key=='Enter'&&send()"><button class=b onclick=send()>➤</button></div>`));const m=$('#ms');m.scrollTop=m.scrollHeight}
const qs=t=>{$('#inp').value=t;send()};
function send(){const t=$('#inp').value.trim();if(!t||C.st=='closed')return;C.msgs.push({f:'me',t});S.dc.msg=(S.dc.msg||0)+1;(C.kind=='b'?bAI:sAI)(C,t);drawChat();$('#inp')&&$('#inp').focus()}
function bAI(c,t){const L=c.L,p=pol(t),n=num(t);c.pol+=p;let r;
if(p<0){c.pat--;r='Давайте без грубости.'}
else if(n){const fl=L.ask*(L.fl-.025*S.up.h-(c.pol>0?.01:0));if(n>=L.ask){r=`Хорошо, ${F(L.ask)}.`;c.offer=L.ask;c.st='deal'}else if(n>=fl){r=pk(['Ладно, уступлю.','Хорошо, по рукам.']);c.offer=n;c.st='deal'}else if(n<L.ask*.6){r='Это несерьёзно.';c.pat--}else{c.cn=r10((fl+(L.ask-fl)*.25));r=`Меньше ${F(c.cn)} не отдам.`;c.pat--}}
else if(/дефект|проблем|состоян|ломан|разбит|царап|работает/i.test(t)){const sh=L.d.filter(x=>!DF[x][2]||L.disc.includes(x));r=sh.length?'Из недостатков: '+sh.map(x=>DF[x][0].toLowerCase()).join(', ')+'.':'Состояние хорошее, всё работает.';if(L.d.some(x=>DF[x][2]&&!L.disc.includes(x))&&Math.random()<.2*S.up.a)r+=' Ну... посмотрите фото повнимательнее.'}
else if(/торг|скидк|уступ|дешев/i.test(t))r='Торг уместен, называйте цену.';else r=pk(['Да, ещё продаётся.','Слушаю вас.','Готов ответить на вопросы.']);
c.msgs.push({f:'ai',t:r});if(c.pat<=0&&c.st!='deal'){c.st='closed';c.msgs.push({f:'ai',t:'Мне некогда, до свидания.'})}}
function sAI(c,t){const p=pol(t),n=num(t),it=c.L.it;c.pol+=p;let r;
if(p<0){c.pat--;r=c.ty=='t'?'Сам такой! Отзыв тебе обеспечен.':'Попрошу без хамства.'}
else if(n){if(n<=c.max){c.offer=n;c.st='deal';r=`Ок, беру за ${F(n)}.`}else if(c.max>c.offer*1.02&&c.pat>0){c.offer=r10(c.offer+(c.max-c.offer)*.5);r=`Могу до ${F(c.offer)}.`;c.pat--}else{c.st='closed';c.offer=0;r=c.ty=='n'?'Не потяну, спасибо.':'Ценник завышен, ищи дурака. Напишу отзыв!';if(c.ty!='n')addRev(1,'Жадный продавец, цена космос.',c.who,'покупатель')}}
else if(/дефект|состоян|работает|царап/i.test(t))r=it.d.length&&c.L.disc?'Вижу в описании: '+it.d.map(x=>DF[x][0].toLowerCase()).join(', ')+'.':'Хорошо, посмотрю на фото.';
else r=pk(['Актуально?','Я готов приехать сегодня.','Подскажите по цене.']);
c.msgs.push({f:'ai',t:r});if(c.pat<=0&&c.st!='deal'&&c.st!='closed'){c.st='closed';c.msgs.push({f:'ai',t:'Ладно, ищу другой вариант.'})}}
function sold(cid){const c=S.chats.find(x=>x.id==cid),L=c.L,it=L.it,pr=c.offer,m=mkt(it);S.bal+=pr;const pf=pr-it.cost;S.earn+=pf;S.dc.earn=(S.dc.earn||0)+pf;S.cnt.sold++;S.dc.sold++;
let s=L.ask<=m*1.05?5:L.ask<=m*1.2?4:L.ask<=m*1.4?3:2,t;if(c.pol<0)s--;if(c.ty=='t'&&pr>c.vb*.85)s=Math.min(s,2);const lie=!L.disc&&it.d.some(x=>!DF[x][2]);if(lie)s=1;s=Math.max(1,s);t=lie?'Обманули: не указали поломку внутри!':c.ty=='t'&&s<3?'Цена не по рынку, продавец хамит.':pk(RT[s]);
addRev(s,t,c.who,'покупатель');S.my=S.my.filter(x=>x.id!=L.id);S.chats.forEach(x=>x.L.id==L.id&&(x.st='closed'));toast(`Продано за ${F(pr)} (${pf>=0?'+':''}${F(pf)})`);cl()}
function sellM(id){const it=gi(id);if(it.keep)return toast('Это твоё устройство: сними отметку');ov(head('Продать: '+it.n)+`<div class=card>Рыночная оценка: <b>${F(val(it))}</b><br><span class=m>Завышенная цена — плохой отзыв и меньше покупателей.</span><input id=pr type=number value=${r10(val(it))} style="margin:8px 0"><label class=row><input type=checkbox id=ds checked style="width:auto"> Указать все дефекты в объявлении</label></div><button class=b onclick="listIt(${id})">Выставить</button>`)}
function listIt(id){const it=gi(id),a=+$('#pr').value;if(a<100)return toast('Укажи цену');S.my.push({id:++S.uid,it,ask:a,disc:$('#ds').checked,n:it.n});S.inv=S.inv.filter(x=>x.id!=id);toast('Объявление опубликовано');cl()}
function unlist(id){const L=S.my.find(x=>x.id==id);S.inv.push(L.it);S.my=S.my.filter(x=>x.id!=id);S.chats.forEach(x=>x.L.id==id&&(x.st='closed'));render()}
const rc=(it,x)=>r10(it.b*DF[x][1]*(1-.05*S.up.r)),rs=()=>Math.min(.95,.7+.03*S.up.r);
function repM(id){const it=gi(id);ov(head('Ремонт: '+it.n)+(it.d.map(x=>{if(x=='pass')return`<div class=card><b>${DF[x][0]}</b><div class=m>Нужно другое устройство с root-правами на складе</div><button class=b onclick="fix(${id},'pass',0)">Сбросить пароль</button></div>`;const o=rc(it,x);return`<div class=card><b>${DF[x][0]}</b><div class=m>Оригинал ${F(o)} · 100%<br>Копия ${F(o*.65)} · ${Math.round(rs()*100)}%</div><div class=row style="margin-top:6px"><button class=b onclick="fix(${id},'${x}',0)">Оригинал</button><button class="b s" onclick="fix(${id},'${x}',1)">Копия</button></div></div>`}).join('')||'<div class=m>Всё исправно</div>'))}
function fix(id,x,cp){const it=gi(id);if(x=='pass'){if(!S.inv.some(o=>o.id!=id&&o.root))return toast('Нет другого устройства с root');it.d=it.d.filter(y=>y!='pass');S.cnt.rep++;S.dc.rep++;toast('Пароль сброшен');return repM(id)}
const c=cp?r10(rc(it,x)*.65):rc(it,x);if(S.bal<c)return toast('Не хватает денег');S.bal-=c;it.cost+=c;if(cp&&Math.random()>rs())toast('Копия не прижилась, деньги потеряны');else{it.d=it.d.filter(y=>y!=x);S.cnt.rep++;S.dc.rep++;toast('Починено')}hdr();repM(id)}
function root(id){if(S.bal<500)return toast('Не хватает денег');S.bal-=500;gi(id).root=1;render()}
function keep(id){const i=gi(id);i.keep=!i.keep;render()}
function decM(id){const it=gi(id);ov(head('Украсить: '+it.n)+`<div class=card><b>Чехол</b> · 700 ₽ · +3% к цене<br><button class=b style="margin-top:6px" onclick="deco(${id},0)">Купить чехол</button></div><div class=card><b>Перекраска</b> · 1 500 ₽ · +2% к цене<select id=cs style="margin:6px 0">${CO.map((c,i)=>`<option value=${i}>${c[0]}</option>`).join('')}</select><button class=b onclick="deco(${id},1)">Перекрасить</button></div>`)}
function deco(id,t){const it=gi(id),c=t?1500:700;if(!t&&it.cased)return toast('Чехол уже есть');if(S.bal<c)return toast('Не хватает денег');S.bal-=c;it.cost+=c;if(t){it.col=+$('#cs').value;it.deco+=.02}else{it.cased=1;it.deco+=.03}toast('Готово');hdr()}
function build(t){const sl=t=='p'?PH:PC,ids=sl.map(s=>+$('#b_'+s).value),mi=sl.filter((s,i)=>!ids[i]);if(mi.length)return toast('Не хватает: '+mi.map(s=>SL[s].replace('Телефон: ','')).join(', '));const ps=ids.map(gi),sum=ps.reduce((s,x)=>s+x.b,0);S.inv=S.inv.filter(x=>!ids.includes(x.id));S.inv.push({id:++S.uid,c:t,n:t=='p'?'Сборный телефон':'Сборный ПК',b:r10(sum*1.25),k:-1,col:rr(0,7),d:[],cost:sum,deco:0,root:0,keep:0});S.cnt.built++;toast('Устройство собрано, оно на складе');render()}
function hdr(){$('#top').innerHTML=`<div class=st><small>Баланс</small><b>${F(S.bal)}</b></div><div class=st><small>Заработок</small><b class="${S.earn<0?'rd':'g'}">${F(S.earn)}</b></div>`}
const TABS=[['feed','🛒','Лента'],['chats','💬','Чаты'],['inv','📦','Склад'],['build','🔧','Сборка'],['up','⬆️','Улучш.'],['q','🎯','Задания'],['prof','👤','Профиль']];
function render(){const m=$('#main'),y=m.scrollTop;m.innerHTML=V[view]();m.scrollTop=y;hdr();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==view?'on':''}" onclick="nav('${t[0]}')"><i>${t[1]}</i>${t[2]}${t[0]=='chats'&&unread()?`<b class=dot>${unread()}</b>`:''}</button>`).join('')}
function nav(v){view=v;$('#main').scrollTop=0;render()}
function tick(){chkDay();mk=mk.map(x=>Math.min(1.25,Math.max(.8,x*(1+R(-.005,.005)))));
if(Math.random()<.5&&S.feed.length>=10){const f=S.feed.filter(x=>!S.chats.some(c=>c.kind=='b'&&c.L.id==x.id&&c.st!='closed'));if(f.length){const o=pk(f);S.feed=S.feed.filter(x=>x!=o)}}
while(S.feed.length<14)S.feed.unshift(mkL());
S.my.forEach(L=>{const it=L.it,vb=mkt(it)*(1+it.deco)*(1-dsum(it,x=>DF[x][2]||L.disc)),n=S.chats.filter(c=>c.kind=='s'&&c.L.id==L.id&&c.st!='closed').length,q=L.ask/vb;if(n<2&&Math.random()<Math.min(.7,.45/q/q)*(1+.1*S.up.p)){const r=Math.random(),ty=r<.6?'n':r<.85?'l':'t',mx=vb*(1+.02*(S.up.h+S.up.p))*(ty=='n'?R(.95,1.05):ty=='l'?R(.72,.88):R(.8,.95)),o=Math.min(L.ask,r10(ty=='n'?mx*R(.88,.98):ty=='l'?mx*R(.55,.75):mx*.75)),who=pk(NM);
S.chats.unshift({id:++S.uid,kind:'s',L,who,ty,max:mx,vb,offer:o,msgs:[{f:'ai',t:ty=='n'?`Здравствуйте! Актуально? Готов взять за ${F(o)}.`:ty=='l'?`Возьму за ${F(o)}, больше не дам.`:`Цена космос. ${F(o)} и не выпендривайся.`}],st:'open',pat:3,pol:0,un:1});toast('💬 Новый покупатель: '+who)}});
save();if($('#ov').style.display!='flex')render();else hdr()}
function save(){try{localStorage.setItem('fl1',JSON.stringify(S))}catch(e){}}
chkDay();S.chats.forEach(c=>{c.L=c.kind=='b'?S.feed.find(x=>x.id==c.L.id)||c.L:S.my.find(x=>x.id==c.L.id)||c.L});while(S.feed.length<14)S.feed.push(mkL());render();setInterval(tick,6000);document.addEventListener('visibilitychange',save);
</script></body></html>
